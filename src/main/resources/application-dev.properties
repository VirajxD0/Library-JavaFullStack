# ============================================================
# Development Profile - H2 In-Memory Database
# ============================================================

# H2 Database Connection
# URL format: jdbc:h2:mem:database_name;DB_CLOSE_DELAY=-1;MODE=MYSQL
#   - mem: in-memory database (data lost on restart)
#   - DB_CLOSE_DELAY=-1: keep database alive while JVM is running
#   - MODE=MYSQL: use MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate dialect for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Initialize data from data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
