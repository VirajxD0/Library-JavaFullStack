# ============================================================
# Library Management System - Application Configuration
# ============================================================

# Application name
spring.application.name=library-management-system

# ==================== JSP View Resolver ====================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ==================== Active Profile ====================
spring.profiles.active=dev

# ==================== Hibernate Configuration ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== Flyway (DB migrations) ====================
# Dev (H2): Flyway runs the versioned baseline above; ddl-auto=update
# stays lenient so local iteration never blocks on drift.
# Prod: see application-prod.properties (ddl-auto=validate + Flyway required).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================== API docs (springdoc) ====================
# Swagger UI: /swagger-ui.html | JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==================== Actuator (health/monitoring) ====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==================== Server Configuration ====================
server.port=8080
server.servlet.context-path=/

# ==================== JWT Configuration (NEW - Spring Security + JWT) ====================
# Secret must be base64-encoded 256-bit key for HS256. Generate via: 
#   openssl rand -base64 32  OR  Keys.secretKeyFor(SignatureAlgorithm.HS256)
# This is a demo secret - change in production via env variable: JWT_SECRET
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
# 86400000ms = 24 hours

# ==================== Multipart Configuration ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
